name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use documentation-safe targets only.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Windows, macOS]
    validations:
      required: true
  - type: input
    id: nmap
    attributes:
      label: Nmap version
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed sensitive targets, credentials, and scan output.
          required: true
